<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designakum Studio — Home</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   TOKENS.  Reconstructed from docs/ux/designakum-design-system-final.md
   §2 and §4.  MUST be reconciled against styles/globals.css before any
   of this becomes real code — this file could not read it.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --brand:#2A6BCE;
  --brand-hover:color-mix(in srgb, var(--brand) 88%, #0C1530);
  --brand-ink:#fff;
  --brand-soft:color-mix(in srgb, var(--brand) 12%, transparent);
  --brand-line:color-mix(in srgb, var(--brand) 28%, transparent);
  --brand-focus:color-mix(in srgb, var(--brand) 55%, transparent);

  --navy:#0C1530;
  --bg:#FBFBFD;
  --surface:#fff;
  --surface-2:#F4F5F8;
  --line:#E5E7EE;
  --line-strong:#D2D6E2;

  --text-primary:#0C1530;
  --text-secondary:#5A6180;
  --text-tertiary:#8A90A8;

  --neutral-bg:#F1F2F6;
  --neutral-border:#E0E2EC;
  --neutral-ink:#4A5070;

  --success:#1E8E5A;

  --radius-s:8px;
  --radius-m:12px;
  --radius-l:18px;

  --t-press:110ms;
  --t-ui:180ms;
  --t-enter:280ms;
  --ease:cubic-bezier(.2,.6,.2,1);

  --font-latin:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Noto Sans Arabic',system-ui,sans-serif;
  --font-ar-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand:color-mix(in srgb,#2A6BCE 78%,#fff);
    --brand-ink:#0C1530;
    --bg:#0A0F1F;--surface:#111830;--surface-2:#161E38;
    --line:#232B47;--line-strong:#2E3757;
    --text-primary:#EEF1F8;--text-secondary:#9BA3BF;--text-tertiary:#6C7492;
    --neutral-bg:#1A2240;--neutral-border:#2A3355;--neutral-ink:#A8AFC8;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text-primary);
  font-family:var(--font-latin);
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
html[dir=rtl] body{font-family:var(--font-ar)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-focus);outline-offset:2px;border-radius:4px}

/* ── prototype banner ─────────────────────────────────────────── */
.proto{
  background:var(--navy);color:#fff;font-size:12px;
  padding:6px 16px;display:flex;gap:12px;align-items:center;
  flex-wrap:wrap;letter-spacing:.01em;
}
.proto b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.proto span{opacity:.72}
.proto .sp{flex:1}
.proto select,.proto button{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;
}

/* ── studio shell ─────────────────────────────────────────────── */
.shell{max-width:1080px;margin:0 auto;padding:0 24px 72px}

/* HEADER.  The client's name is the loudest thing here.  The Designakum
   wordmark is deliberately absent — the diamond is enough.  This screen
   belongs to Noura, not to us. */
header.bar{
  display:flex;align-items:center;gap:14px;
  padding:16px 0 14px;
  margin-bottom:18px;flex-wrap:wrap;
}
.dia{width:10px;height:10px;background:var(--brand);transform:rotate(43deg);border-radius:1px;flex:none}
.owner{font-weight:700;font-size:17px;letter-spacing:-.015em}
html[dir=rtl] .owner{font-family:var(--font-ar-display);letter-spacing:0;font-size:19px}
.bar .sp{flex:1}

.pubstate{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-secondary)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.tick{color:var(--success)}

.btn{
  border:1px solid transparent;border-radius:var(--radius-s);
  padding:8px 15px;font-weight:600;font-size:14px;
  background:var(--brand);color:var(--brand-ink);
  transition:background var(--t-ui) var(--ease),transform var(--t-press) var(--ease);
}
.btn:hover{background:var(--brand-hover)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text-secondary);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text-primary)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.quiet{background:none;border:0;color:var(--text-secondary);font-weight:500}
.btn.quiet:hover{color:var(--text-primary)}

/* ── publish sheet — where the COUNT lives ────────────────────── */
.sheet{
  background:var(--surface);border:1px solid var(--brand-line);
  border-radius:var(--radius-m);padding:16px 18px;margin-bottom:16px;
  animation:rise var(--t-enter) var(--ease) both;
}
.sheet b{display:block;font-size:15.5px;font-weight:600;margin-bottom:3px}
.sheet p{margin:0 0 3px;font-size:13.5px;color:var(--text-secondary)}
.sheet .note{font-size:13px;color:var(--text-tertiary)}
.sheet .acts{display:flex;gap:9px;align-items:center;margin-top:13px;flex-wrap:wrap}

/* ── preview ──────────────────────────────────────────────────── */
.stage{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-l);overflow:hidden;position:relative;
  transition:border-color var(--t-ui) var(--ease);
}
.stage:hover{border-color:var(--brand-line)}
.frame{display:block;border:0;background:var(--surface);transform-origin:top left}
/* Height follows the viewport: rich on a large display, never so tall on a
   laptop that "A few things waiting" falls below the fold.  The floor keeps
   it a real portfolio rather than a thumbnail. */
.stage.desktop{height:clamp(240px,40vh,520px)}
.stage.mobile{height:clamp(320px,48vh,560px);max-width:390px;margin:0 auto}

.previewFoot{
  display:flex;align-items:center;gap:12px;
  padding:9px 2px 0;font-size:13px;color:var(--text-tertiary);
  flex-wrap:wrap;
}
.previewFoot .sp{flex:1}
.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:7px;padding:2px}
.seg button{
  border:0;background:transparent;border-radius:5px;
  padding:4px 11px;font-size:12.5px;color:var(--text-secondary);
  transition:background var(--t-ui) var(--ease);
}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text-primary);font-weight:600;
  box-shadow:0 1px 2px rgba(12,21,48,.07)}

/* ── queue ────────────────────────────────────────────────────── */
.queueHead{
  margin:24px 0 12px;font-size:13px;font-weight:600;
  color:var(--text-secondary);letter-spacing:.02em;
}
html[dir=rtl] .queueHead{font-family:var(--font-ar-display);letter-spacing:0;font-size:15px}

.item{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-m);padding:14px 18px;margin-bottom:9px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  animation:rise var(--t-enter) var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item .txt{flex:1;min-width:220px}
.item .txt b{display:block;font-weight:600;font-size:14.5px}
.item .txt i{display:block;font-style:normal;font-size:13px;color:var(--text-tertiary);margin-top:1px}
.item .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.skip{
  background:none;border:0;color:var(--text-tertiary);font-size:13px;
  padding:6px 4px;transition:color var(--t-ui) var(--ease);
}
.skip:hover{color:var(--text-secondary)}

.empty{
  border:1px dashed var(--line-strong);border-radius:var(--radius-m);
  padding:22px 18px;text-align:center;color:var(--text-secondary);
}
.empty b{display:block;font-size:16px;color:var(--text-primary);font-weight:600;margin-bottom:2px}
html[dir=rtl] .empty b{font-family:var(--font-ar-display)}
.empty .btn{margin-top:12px}

/* ── offline banner ───────────────────────────────────────────── */
.offline{
  background:var(--neutral-bg);border:1px solid var(--neutral-border);
  color:var(--neutral-ink);border-radius:var(--radius-m);
  padding:13px 18px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.offline .txt{flex:1;min-width:200px}
.offline b{display:block;font-weight:600;color:var(--text-primary)}

/* ── footer ───────────────────────────────────────────────────── */
.foot{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:13.5px;color:var(--text-secondary);
}
.foot .sp{flex:1}
.addr{display:flex;align-items:center;gap:9px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.copy{background:none;border:0;color:var(--text-tertiary);font-size:13px}
.copy:hover{color:var(--brand)}
.more{background:none;border:0;color:var(--text-primary);font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:6px}
.more:hover{color:var(--brand)}

@media (max-width:820px){
  .stage.desktop{height:clamp(200px,30vh,320px)}
  .shell{padding:0 16px 60px}
}
</style>
</head>
<body>

<!-- ══ PROTOTYPE CONTROLS — not part of the product ══ -->
<div class="proto">
  <b>Prototype</b>
  <span>state</span>
  <select id="stateSel">
    <option value="ahead">Live · changes not yet live</option>
    <option value="never">Never published</option>
    <option value="sync">Live · up to date</option>
    <option value="clear">Queue empty</option>
    <option value="offline">Offline</option>
  </select>
  <button id="langBtn">العربية</button>
  <button id="editBtn">simulate an edit</button>
  <span class="sp"></span>
  <span id="chan">draft channel: —</span>
</div>

<div class="shell">

  <header class="bar">
    <span class="dia"></span>
    <div class="owner" id="ownerTxt">Noura Al-Harbi</div>
    <div class="sp"></div>
    <div class="pubstate" id="pubState"></div>
    <button class="btn" id="pubBtn">Publish</button>
  </header>

  <div id="offlineSlot"></div>
  <div id="sheetSlot"></div>

  <div class="previewWrap">
    <div class="stage desktop" id="stage">
      <iframe class="frame" id="frame" title="Your portfolio"></iframe>
    </div>
    <div class="previewFoot">
      <span id="privacyLine"></span>
      <span class="sp"></span>
      <div class="seg">
        <button id="dBtn" aria-pressed="true">desktop</button>
        <button id="mBtn" aria-pressed="false">mobile</button>
      </div>
    </div>
  </div>

  <div id="queueHead" class="queueHead"></div>
  <div id="queue"></div>

  <div class="foot">
    <div class="addr" id="addrSlot"></div>
    <div class="sp"></div>
    <button class="more" id="moreBtn">Everything else <span>→</span></button>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   MOCK DRAFT DATA.  No backend.  Shape follows blueprint §9.
   ══════════════════════════════════════════════════════════════════ */
const seed = {
  name:  {en:'Noura Al-Harbi',  ar:'نورة الحربي'},
  title: {en:'Photographer, Riyadh', ar:'مصوّرة، الرياض'},
  bio:   {en:'I photograph people the way they actually are — unhurried, in their own light.',
          ar:'أصوّر الناس كما هم — دون استعجال، وفي ضوئهم الخاص.'},
  bioIsSuggestion:true,
  pieces:[
    {id:1,name:{en:'',ar:''},tone:'#C8CEDC'},
    {id:2,name:{en:'',ar:''},tone:'#B6BFD2'},
    {id:3,name:{en:'',ar:''},tone:'#D3D8E4'},
    {id:4,name:{en:'Layla, at home',ar:'ليلى، في البيت'},tone:'#AEB8CE'},
    {id:5,name:{en:'Souq mornings',ar:'صباحات السوق'},tone:'#C0C8D8'},
  ]
};
const clone = o => JSON.parse(JSON.stringify(o));

let draft = clone(seed), published = clone(seed);
let lang='en', view='desktop', mode='ahead', seq=0, sheetOpen=false;

function desync(){
  published = clone(seed);
  published.bio = {en:'Photographer based in Riyadh.', ar:'مصوّرة مقيمة في الرياض.'};
  published.pieces = published.pieces.slice(0,3);
  draft = clone(seed);
}
desync();

/* ── the diff.  Its COUNT is not shown in the header any more — it
   belongs to the publish sheet, where it is about to mean something. ── */
function diff(){
  const parts=[];
  if(mode==='never') return {n:0,parts};
  if(JSON.stringify(draft.bio)!==JSON.stringify(published.bio)) parts.push('bio');
  if(draft.title.en!==published.title.en) parts.push('title');
  if(draft.name.en!==published.name.en) parts.push('name');
  const added = draft.pieces.length - published.pieces.length;
  for(let i=0;i<Math.abs(added);i++) parts.push('piece');
  return {n:parts.length, parts};
}

/* ══════════════════════════════════════════════════════════════════
   THE RENDERER.  One renderer, two inputs.

   The portfolio lives in its own document.  The Studio never draws a
   picture of it — it sends draft data across a channel and this renders
   it.  In production this document is the real public page at
   /{slug}?preview=1.

   Entrances play on FIRST PAINT ONLY (blueprint §8.3, motion rules).
   An unnamed piece shows NO caption: this is the visitor's view, and a
   visitor must never see Studio state such as the word "Unnamed".
   ══════════════════════════════════════════════════════════════════ */
const RENDERER = `<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,-apple-system,sans-serif;
    color:#0C1530;background:#fff;padding:44px 60px;line-height:1.55}
  body[dir=rtl]{font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',system-ui,sans-serif}
  .enter{animation:e 520ms cubic-bezier(.2,.6,.2,1) both}
  .enter:nth-child(2){animation-delay:60ms}
  .enter:nth-child(3){animation-delay:110ms}
  .enter:nth-child(4){animation-delay:160ms}
  @keyframes e{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.enter{animation:none}}
  h1{font-size:40px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
  body[dir=rtl] h1{font-family:'Reem Kufi','IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
  .role{font-size:16px;color:#5A6180;margin:0 0 20px}
  .bio{font-size:17px;max-width:46ch;margin:0 0 30px;color:#2A3050}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  figure{margin:0}
  .ph{aspect-ratio:16/10;border-radius:10px}
  figcaption{font-size:13px;color:#5A6180;margin-top:7px;min-height:18px}
  .hit{cursor:pointer;border-radius:12px;transition:box-shadow 180ms}
  .hit:hover{box-shadow:0 0 0 2px #2A6BCE55}
  @media (max-width:520px){
    body{padding:30px 22px}
    h1{font-size:27px}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .bio{font-size:15px;margin-bottom:22px}
  }
</style></head><body>
<div id="root"></div>
<script>
  var painted=false,lastSeq=-1;
  function draw(d,lang){
    var rtl=lang==='ar';
    document.body.dir=rtl?'rtl':'ltr';
    document.documentElement.lang=lang;
    var cls=painted?'':'enter';
    var pick=function(f){return f[lang]||''};
    var pieces=d.pieces.map(function(p){
      return '<figure class="hit" data-field="piece:'+p.id+'">'+
        '<div class="ph" style="background:'+p.tone+'"></div>'+
        '<figcaption>'+pick(p.name)+'</figcaption></figure>';
    }).join('');
    document.getElementById('root').innerHTML=
      '<h1 class="'+cls+'" data-field="name">'+pick(d.name)+'</h1>'+
      '<p class="role '+cls+'" data-field="title">'+pick(d.title)+'</p>'+
      '<p class="bio '+cls+'" data-field="bio">'+pick(d.bio)+'</p>'+
      '<div class="grid '+cls+'">'+pieces+'</div>';
    painted=true;
  }
  addEventListener('message',function(e){
    var m=e.data;
    if(!m||m.type!=='designakum:draft')return;
    if(m.seq<=lastSeq)return;              /* out-of-order cannot regress the view */
    lastSeq=m.seq; draw(m.draft,m.lang);
  });
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-field]');
    if(!el)return;
    parent.postMessage({type:'designakum:field',field:el.dataset.field},'*');
  });
  parent.postMessage({type:'designakum:preview-ready'},'*');
<\/script></body></html>`;

/* ── the draft channel ──────────────────────────────────────────── */
const frame=document.getElementById('frame');
let frameReady=false;
function boot(){ frameReady=false; frame.srcdoc=RENDERER; }
function push(){
  if(!frameReady)return;
  seq++;
  /* production: targetOrigin is the EXACT origin, never '*'.  srcdoc
     frames are opaque-origin, so '*' is unavoidable here only. */
  frame.contentWindow.postMessage({type:'designakum:draft',seq,draft,lang},'*');
  document.getElementById('chan').textContent='draft channel: seq '+seq;
}
addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type==='designakum:preview-ready'){ frameReady=true; push(); }
  if(m.type==='designakum:field'){
    const L=t();
    toast(m.field.startsWith('piece:') ? L.editPiece : L.editField(m.field));
  }
});

/* ── viewport truth: each mode is a REAL width, scaled only in size ── */
function layout(){
  const stage=document.getElementById('stage');
  const w = view==='desktop' ? 1280 : 390;
  const scale = stage.clientWidth / w;
  frame.style.width=w+'px';
  frame.style.height=(stage.clientHeight/scale)+'px';
  frame.style.transform='scale('+scale+')';
  frame.style.transformOrigin = document.documentElement.dir==='rtl' ? 'top right' : 'top left';
}

/* ── copy ───────────────────────────────────────────────────────── */
const T={
  en:{
    owner:'Noura Al-Harbi',
    publish:'Publish', notLive:"Your latest changes aren't live yet",
    upToDate:'up to date',
    onlyYouChanges:'Only you can see these changes.',
    onlyYou:'Only you can see this.',
    visitorsSee:'This is what visitors see.',
    headMany:'A few things waiting', headOne:'One thing waiting',
    bioTitle:'Your bio suggestion is ready.',
    bioSub:'We wrote something to start from. Keep it, or make it yours.',
    keep:'keep it', another:'another way', mine:'write mine',
    /* never "missing" — that implies a mistake.  "could use" is optional
       by grammar, and does not repeat the heading's "waiting". */
    piecesTitle:n=>n===1?'One piece could use a name.':n+' pieces could use names.',
    piecesSub:'A name helps visitors know what they are looking at.',
    nameThem:'name them', skip:'skip →',
    addTitle:'Your work goes here.', addSub:'Three to six pieces is a portfolio.',
    addWork:'add work',
    readyB:'Ready when you are.', readyS:'Nothing is waiting. Publish whenever you like.',
    clearB:'Nothing needs you.', clearS:"It's all up to date.",
    live:'Live', copy:'⧉ copy', more:'Everything else',
    offB:'Your portfolio is offline.', offS:'Your work is safe.', react:'Reactivate',
    desktop:'desktop', mobile:'mobile', lang:'العربية',
    sheetB:n=>'Publish '+n+(n===1?' change':' changes')+'?',
    sheetFirstB:'Publish your portfolio?',
    sheetFirstP:'It will be live at designakum.site/noura. You can take it down at any time.',
    sheetNote:n=>n+(n===1?' suggestion you have':' suggestions you have')+" not looked at yet.",
    notYet:'not yet',
    editPiece:'Edit that piece',
    editField:f=>'Edit your '+f,
    partBio:'your bio', partTitle:'your title', partName:'your name',
    partPiece:n=>n+(n===1?' piece':' pieces'),
    and:', and '
  },
  ar:{
    owner:'نورة الحربي',
    publish:'انشري', notLive:'تغييراتك الأخيرة لم تظهر للزوار بعد',
    upToDate:'محدَّث',
    onlyYouChanges:'أنتِ وحدك ترين هذه التغييرات.',
    onlyYou:'أنتِ وحدك ترين هذا.',
    visitorsSee:'هذا ما يراه الزوار.',
    headMany:'أشياء تنتظرك', headOne:'شيء واحد ينتظرك',
    bioTitle:'نبذة مقترحة جاهزة لكِ.',
    bioSub:'كتبنا بداية. أبقيها، أو اجعليها بصوتك.',
    keep:'أبقيها', another:'صياغة أخرى', mine:'أكتبها بنفسي',
    /* Arabic takes its own softening from «بعد» (yet), not a literal
       rendering of "could use" — which has no calm Arabic equivalent. */
    piecesTitle:n=>n===1?'عمل واحد بلا اسم بعد.':n+' أعمال بلا أسماء بعد.',
    piecesSub:'الاسم يساعد الزائر على فهم ما يراه.',
    nameThem:'سمّيها', skip:'← تخطّي',
    addTitle:'أعمالك تُعرض هنا.', addSub:'من ثلاثة إلى ستة أعمال تصنع معرضًا.',
    addWork:'أضيفي عملًا',
    readyB:'جاهز متى ما كنتِ مستعدة.', readyS:'لا شيء ينتظر. انشري متى شئتِ.',
    clearB:'لا شيء يحتاجك.', clearS:'كل شيء محدَّث.',
    live:'منشور', copy:'⧉ نسخ', more:'كل شيء آخر',
    offB:'معرضك غير متاح الآن.', offS:'أعمالك محفوظة.', react:'أعيدي التفعيل',
    desktop:'سطح المكتب', mobile:'جوال', lang:'English',
    sheetB:n=>'تنشرين '+n+' تغييرات؟',
    sheetFirstB:'تنشرين معرضك؟',
    sheetFirstP:'سيكون على designakum.site/noura. يمكنكِ إخفاؤه متى شئتِ.',
    sheetNote:n=>n+' اقتراح لم تطّلعي عليه بعد.',
    notYet:'ليس الآن',
    editPiece:'تحرير هذا العمل',
    editField:f=>'تحرير '+({bio:'النبذة',title:'المسمّى',name:'الاسم'}[f]||f),
    partBio:'النبذة', partTitle:'المسمّى', partName:'الاسم',
    partPiece:n=>n+' أعمال',
    and:' و'
  }
};
const t=()=>T[lang];

/* ── queue, computed from the draft ─────────────────────────────── */
let skipped=new Set();
function queueItems(){
  const L=t(), out=[];
  if(draft.pieces.length===0){
    out.push({id:'add',b:L.addTitle,i:L.addSub,acts:[['primary',L.addWork]]});
    return out;
  }
  if(draft.bioIsSuggestion && !skipped.has('bio')){
    out.push({id:'bio',b:L.bioTitle,i:L.bioSub,
      acts:[['ghost',L.keep],['ghost',L.another],['ghost',L.mine]]});
  }
  const unnamed=draft.pieces.filter(p=>!p.name.en&&!p.name.ar).length;
  if(unnamed && !skipped.has('pieces')){
    out.push({id:'pieces',b:L.piecesTitle(unnamed),i:L.piecesSub,
      acts:[['ghost',L.nameThem]],skip:true});
  }
  return out;
}

/* ── publish sheet: the one place a COUNT is allowed ────────────── */
function sheetHTML(){
  const L=t(), d=diff();
  const first = mode==='never';
  const counts={};
  d.parts.forEach(p=>counts[p]=(counts[p]||0)+1);
  const phrases=[];
  if(counts.bio) phrases.push(L.partBio);
  if(counts.title) phrases.push(L.partTitle);
  if(counts.name) phrases.push(L.partName);
  if(counts.piece) phrases.push(L.partPiece(counts.piece));
  const summary = phrases.length>1
    ? phrases.slice(0,-1).join('، ')+L.and+phrases[phrases.length-1]
    : (phrases[0]||'');
  const unread = draft.bioIsSuggestion?1:0;
  return '<div class="sheet">'+
    '<b>'+(first?L.sheetFirstB:L.sheetB(d.n))+'</b>'+
    (first?'<p>'+L.sheetFirstP+'</p>':'<p>'+summary+'</p>')+
    (unread?'<p class="note">'+L.sheetNote(unread)+'</p>':'')+
    '<div class="acts"><button class="btn" id="doPub">'+L.publish+'</button>'+
    '<button class="btn quiet" id="noPub">'+L.notYet+'</button></div></div>';
}

/* ── render ─────────────────────────────────────────────────────── */
function render(){
  const L=t(), d=diff();
  document.getElementById('ownerTxt').textContent=L.owner;
  document.getElementById('dBtn').textContent=L.desktop;
  document.getElementById('mBtn').textContent=L.mobile;
  document.getElementById('moreBtn').innerHTML=L.more+' <span>'+(lang==='ar'?'←':'→')+'</span>';
  document.getElementById('langBtn').textContent=L.lang;

  /* header — a sentence, never a count */
  const ps=document.getElementById('pubState'), pb=document.getElementById('pubBtn');
  ps.innerHTML=''; pb.style.display='';
  if(mode==='never'){
    ps.innerHTML='<span>'+L.onlyYou+'</span>'; pb.textContent=L.publish;
  }else if(mode==='offline'){
    pb.style.display='none';
  }else if(d.n>0){
    ps.innerHTML='<span class="dot"></span>'+L.notLive; pb.textContent=L.publish;
  }else{
    ps.innerHTML='<span class="tick">✓</span>'+L.upToDate; pb.style.display='none';
  }

  document.getElementById('sheetSlot').innerHTML = sheetOpen ? sheetHTML() : '';

  const pl=document.getElementById('privacyLine');
  pl.textContent = mode==='never' ? L.onlyYou : (d.n>0 ? L.onlyYouChanges : L.visitorsSee);

  document.getElementById('offlineSlot').innerHTML = mode!=='offline' ? '' :
    '<div class="offline"><div class="txt"><b>'+L.offB+'</b>'+L.offS+'</div>'+
    '<button class="btn sm">'+L.react+'</button></div>';

  const items=(mode==='clear'||mode==='sync')?[]:queueItems();
  const qh=document.getElementById('queueHead'), q=document.getElementById('queue');
  if(items.length===0){
    qh.textContent='';
    const first=(mode==='never');
    q.innerHTML='<div class="empty"><b>'+(first?L.readyB:L.clearB)+'</b>'+
      (first?L.readyS:L.clearS)+
      (first?'<div><button class="btn" id="emptyPub">'+L.publish+'</button></div>':'')+'</div>';
  }else{
    qh.textContent=items.length===1?L.headOne:L.headMany;
    q.innerHTML=items.map(it=>
      '<div class="item"><div class="txt"><b>'+it.b+'</b><i>'+it.i+'</i></div>'+
      '<div class="acts">'+
      it.acts.map(a=>'<button class="btn '+(a[0]==='ghost'?'ghost ':'')+'sm">'+a[1]+'</button>').join('')+
      (it.skip?'<button class="skip" data-skip="'+it.id+'">'+L.skip+'</button>':'')+
      '</div></div>').join('');
  }

  document.getElementById('addrSlot').innerHTML =
    (mode==='never'||mode==='offline') ? '' :
    '<span class="livedot"></span><span>'+L.live+' · designakum.site/noura</span>'+
    '<button class="copy">'+L.copy+'</button>';

  push(); layout();
}

/* ── toast ──────────────────────────────────────────────────────── */
let toastEl;
function toast(msg){
  if(!toastEl){
    toastEl=document.createElement('div');
    toastEl.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);'+
      'background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;'+
      'opacity:0;transition:opacity 180ms;z-index:9;pointer-events:none';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent=msg; toastEl.style.opacity='1';
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.style.opacity='0',1600);
}

/* ── wiring ─────────────────────────────────────────────────────── */
document.getElementById('stateSel').addEventListener('change',e=>{
  mode=e.target.value; skipped.clear(); sheetOpen=false;
  if(mode==='never') published=clone(draft);
  if(mode==='sync'||mode==='clear'){
    published=clone(draft); draft.bioIsSuggestion=false;
    draft.pieces.forEach((p,i)=>{ if(!p.name.en) p.name={en:'Untitled study '+(i+1),ar:'دراسة '+(i+1)} });
    published=clone(draft);
  }
  if(mode==='ahead'||mode==='offline') desync();
  render();
});
document.getElementById('langBtn').addEventListener('click',()=>{
  lang=lang==='en'?'ar':'en';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  render();
});
document.getElementById('editBtn').addEventListener('click',()=>{
  draft.title={en:'Portrait photographer, Riyadh',ar:'مصوّرة بورتريه، الرياض'};
  render();
});
document.getElementById('pubBtn').addEventListener('click',()=>{ sheetOpen=true; render(); });
document.addEventListener('click',e=>{
  if(e.target.id==='doPub'||e.target.id==='emptyPub'){
    published=clone(draft);
    if(mode==='never'){ mode='sync'; document.getElementById('stateSel').value='sync'; }
    sheetOpen=false; render(); return;
  }
  if(e.target.id==='noPub'){ sheetOpen=false; render(); return; }
  const s=e.target.closest('[data-skip]');
  if(s){ skipped.add(s.dataset.skip); render(); }
});
document.getElementById('dBtn').addEventListener('click',()=>setView('desktop'));
document.getElementById('mBtn').addEventListener('click',()=>setView('mobile'));
function setView(v){
  view=v;
  document.getElementById('stage').className='stage '+v;
  document.getElementById('dBtn').setAttribute('aria-pressed',v==='desktop');
  document.getElementById('mBtn').setAttribute('aria-pressed',v==='mobile');
  layout();
}
addEventListener('resize',layout);

boot(); render();
</script>
</body></html>

<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — the canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   STUDIO — the screen a creator sees when they open it.

   Their FINISHED portfolio. Not a blank canvas, not prompts, not setup. The
   site is already there, complete, at full size, and every part of it answers
   to touch:

     click the name        -> edit it where it sits
     click a project       -> its own controls, at the project
     drag a project        -> the work reorders, and the page moves with it
     change the appearance -> the whole site transforms in place

   Nothing is saved, nothing reloads, nothing previews. The page you are
   looking at IS the page.

   HYPOTHESIS, NOT REFERENCE-DERIVED. The Lumetra session was unreachable
   while this was built, so the quality bar here is the principles we agreed —
   not a comparison. Treat the specifics as proposals.

   Tokens and motion values are the product's own (styles/globals.css). CSS
   only; no dependency implied.
   ========================================================================= */

:root{
  --bg:#fff; --ink:#0c1530;
  --ink-2:rgba(12,21,48,.70); --ink-3:rgba(12,21,48,.42); --ink-4:rgba(12,21,48,.13);
  --chrome:rgba(255,255,255,.82);
  --brand:#2A6BCE; --brand-soft:rgba(42,107,206,.10); --brand-line:rgba(42,107,206,.32);
  --brand-focus:rgba(42,107,206,.55);

  --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-8:48px; --space-10:64px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;

  --t-press:.11s; --t-ui:.22s; --t-enter:.30s; --t-stag:.06s;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-pop:cubic-bezier(.2,1.06,.32,1);

  --font:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-ar:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;

  /* The SITE's own look — the creator's brand, changed live by Appearance.
     Designakum blue is chrome only and never appears in the page itself. */
  --site:#1E4FA3;
  --paper:#ffffff;
  --sink:#101828;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font);background:var(--paper);color:var(--sink);
  -webkit-font-smoothing:antialiased;
  transition:background-color var(--t-enter) var(--ease),color var(--t-enter) var(--ease);
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-focus);outline-offset:3px;border-radius:4px}

/* ------------------------------------------------------------------ chrome.
   A single hairline bar that floats over the site and never competes with it.
   No sidebar: there is nothing to navigate to, because everything editable is
   on the page in front of you. */
.bar{
  position:fixed;inset-block-start:0;inset-inline:0;z-index:100;
  height:52px;display:flex;align-items:center;gap:var(--space-3);
  padding-inline:var(--space-5);
  background:var(--chrome);backdrop-filter:blur(14px);
  border-block-end:1px solid var(--ink-4);
}
.mk{inline-size:24px;block-size:24px;border-radius:6px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:800}
.bar .nm{font-size:12px;font-weight:700;color:var(--ink-3)}
.bar .end{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.tool{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding-inline:10px;
  background:none;border:1px solid transparent;border-radius:var(--radius-sm);
  color:var(--ink-3);font-size:12px;font-weight:700;
  transition:color var(--t-ui) var(--ease),background-color var(--t-ui) var(--ease),
             transform var(--t-press) var(--ease);
}
.tool:hover{color:var(--ink);background:var(--brand-soft)}
.tool:active{transform:scale(.96)}
.tool.on{color:var(--brand);background:var(--brand-soft)}

/* ------------------------------------------------------------------ the site.
   Full bleed. Its own margins, its own measure. Nothing frames it. */
.site{max-inline-size:1120px;margin-inline:auto;padding:clamp(96px,14vh,150px) clamp(24px,7vw,88px) 160px}

/* ------------------------------------------------------------- editability.
   Silent at rest. On approach a region names itself and lifts a hairline —
   the page never wears its editability as decoration. */
.ed{position:relative;border-radius:6px;cursor:text;
  transition:box-shadow var(--t-ui) var(--ease)}
.ed:hover{box-shadow:0 0 0 5px var(--brand-soft)}
.ed[contenteditable="true"]{outline:none;box-shadow:0 0 0 2px var(--brand)}
.ed::after{
  content:attr(data-n);position:absolute;
  inset-block-end:calc(100% + 6px);inset-inline-start:0;
  padding:2px 6px;border-radius:5px;background:var(--brand);color:#fff;
  font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;
  opacity:0;transform:translateY(3px);pointer-events:none;
  transition:opacity var(--t-ui) var(--ease),transform var(--t-ui) var(--ease);
}
.ed:hover::after,.ed[contenteditable="true"]::after{opacity:1;transform:none}
[dir="rtl"] .ed::after{letter-spacing:0;text-transform:none}

/* ------------------------------------------------------------------- hero */
.hero{display:grid;gap:var(--space-4);justify-items:start}
.photo{
  inline-size:96px;block-size:96px;border-radius:50%;
  background:var(--site);opacity:.16;cursor:pointer;
  transition:background-color var(--t-enter) var(--ease),transform var(--t-press) var(--ease);
}
.photo:active{transform:scale(.97)}
.nm-l{font-size:clamp(40px,5.6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.rl{font-size:clamp(19px,2.2vw,25px);font-weight:600;color:var(--site);margin:0;
  transition:color var(--t-enter) var(--ease)}
.bo{font-size:clamp(16px,1.4vw,18px);line-height:1.62;color:color-mix(in srgb,var(--sink) 74%,transparent);
  max-inline-size:56ch;margin:var(--space-3) 0 0}

.meta{display:flex;gap:var(--space-8);margin-block-start:var(--space-6)}
.meta b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.meta span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:color-mix(in srgb,var(--sink) 46%,transparent)}
[dir="rtl"] .meta span{letter-spacing:0;text-transform:none}

/* ------------------------------------------------------------------- work */
.work{margin-block-start:clamp(64px,10vh,110px)}
.wh{display:flex;align-items:center;gap:var(--space-3);margin-block-end:var(--space-5)}
.wh h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.hint{
  font-size:11px;font-weight:700;color:var(--ink-3);
  opacity:0;transition:opacity var(--t-ui) var(--ease);
}
.work:hover .hint{opacity:1}

/* 272px keeps three across at 1280 — a portfolio reads as a body of work in
   threes and as a pair of samples in twos. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--space-5)}

.card{position:relative;display:grid;gap:var(--space-3);
  transition:opacity var(--t-ui) var(--ease)}
.cov{
  position:relative;aspect-ratio:4/3;border-radius:var(--radius-md);overflow:hidden;
  background:var(--site);
  transition:background-color var(--t-enter) var(--ease),
             box-shadow var(--t-ui) var(--ease),
             transform var(--t-ui) var(--ease);
}
.card:hover .cov{transform:translateY(-3px);box-shadow:0 10px 30px rgba(12,21,48,.14)}
.card.sel .cov{box-shadow:0 0 0 2px var(--brand),0 10px 30px rgba(12,21,48,.14)}
/* Covers are flat marks, not gradients — the system forbids gradients, and a
   real cover is the creator's photograph anyway. */
.cov i{position:absolute;inset:0;opacity:1;transition:opacity var(--t-enter) var(--ease)}
.cov i.out{opacity:0}
.card h3{font-size:15px;font-weight:700;margin:0}
.card p{font-size:13px;color:color-mix(in srgb,var(--sink) 52%,transparent);margin:0}

/* The drag handle appears on approach and is the only affordance that says
   "this can move". Dragging the card body would fight text selection. */
.grip{
  position:absolute;inset-block-start:10px;inset-inline-start:10px;z-index:5;
  inline-size:28px;block-size:28px;border-radius:8px;
  background:rgba(255,255,255,.92);border:0;color:var(--ink);
  display:grid;place-items:center;font-size:13px;line-height:1;
  cursor:grab;opacity:0;transform:translateY(-3px);
  box-shadow:0 2px 8px rgba(12,21,48,.18);
  transition:opacity var(--t-ui) var(--ease),transform var(--t-ui) var(--ease);
}
.card:hover .grip{opacity:1;transform:none}
.grip:active{cursor:grabbing}
.card.dragging{opacity:.35}
.card.drop-hint .cov{box-shadow:0 0 0 2px var(--brand-line)}

/* FLIP: the cards travel to their new places. A reorder that simply repaints
   reads as a list update; one that moves reads as your page rearranging. */
.card.flip{transition:transform var(--t-enter) var(--ease)}

/* ------------------------------------------------------- project controls.
   They belong to the project and appear AT it — not in a settings panel on
   the far side of the screen. Only the selected project's controls exist. */
.ctl{
  /* fixed, not absolute: it is placed from viewport coordinates and follows
     the project on scroll. Absolute here drifts the moment the page moves. */
  position:fixed;z-index:60;
  inline-size:264px;padding:var(--space-4);
  background:var(--bg);border:1px solid var(--ink-4);border-radius:var(--radius-lg);
  box-shadow:0 18px 50px rgba(12,21,48,.20);
  display:grid;gap:var(--space-4);
  opacity:0;transform:translateY(-6px) scale(.98);visibility:hidden;
  transition:opacity var(--t-ui) var(--ease),transform var(--t-ui) var(--ease-pop),
             visibility 0s linear var(--t-ui);
  color:var(--ink);
}
.ctl.open{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.ctl .lb{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-block-end:8px}
[dir="rtl"] .ctl .lb{letter-spacing:0;text-transform:none}
.sw-row{display:flex;gap:8px;flex-wrap:wrap}
.sw{inline-size:30px;block-size:30px;border-radius:8px;border:2px solid transparent;
  transition:transform var(--t-press) var(--ease),border-color var(--t-ui) var(--ease)}
.sw:hover{transform:translateY(-2px)}
.sw.on{border-color:var(--ink)}
.ctl-act{display:flex;gap:8px}
.mini{
  flex:1;height:32px;border-radius:var(--radius-sm);border:1px solid var(--ink-4);
  background:none;color:var(--ink-2);font-size:12px;font-weight:700;
  transition:border-color var(--t-ui) var(--ease),color var(--t-ui) var(--ease),
             transform var(--t-press) var(--ease);
}
.mini:hover{color:var(--ink);border-color:var(--ink-3)}
.mini:active{transform:scale(.96)}

/* ---------------------------------------------------------- appearance tray */
.tray{
  position:fixed;inset-block-start:58px;inset-inline-end:var(--space-5);z-index:90;
  inline-size:250px;padding:var(--space-4);
  background:var(--bg);border:1px solid var(--ink-4);border-radius:var(--radius-lg);
  box-shadow:0 18px 50px rgba(12,21,48,.18);
  display:grid;gap:var(--space-4);color:var(--ink);
  opacity:0;transform:translateY(-8px) scale(.98);visibility:hidden;
  transition:opacity var(--t-ui) var(--ease),transform var(--t-ui) var(--ease-pop),
             visibility 0s linear var(--t-ui);
}
.tray.open{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.tray .lb{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-block-end:8px}
[dir="rtl"] .tray .lb{letter-spacing:0;text-transform:none}

.contact{margin-block-start:clamp(64px,10vh,110px);display:flex;justify-content:center}
.contact button{
  padding:15px 30px;border-radius:var(--radius-md);border:0;
  background:var(--site);color:#fff;font-size:15px;font-weight:700;
  transition:background-color var(--t-enter) var(--ease),transform var(--t-press) var(--ease);
}
.contact button:active{transform:scale(.97)}

[dir="rtl"] .nm-l,[dir="rtl"] .wh h2{font-family:var(--font-ar);letter-spacing:0;line-height:1.3}
[dir="rtl"] .bo{line-height:1.85}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="mk">د</div><span class="nm" id="barTxt">Studio</span>
  <div class="end">
    <button class="tool" id="appBtn">◐ <span id="appTxt">Appearance</span></button>
    <button class="tool" id="langBtn">العربية</button>
  </div>
</div>

<div class="tray" id="tray">
  <div><div class="lb" id="lbAccent">Accent</div><div class="sw-row" id="accents"></div></div>
  <div><div class="lb" id="lbPaper">Paper</div><div class="sw-row" id="papers"></div></div>
</div>

<!-- THE SITE. Finished, populated, real. -->
<main class="site">
  <section class="hero">
    <div class="photo" id="photo" title="Replace photo"></div>
    <h1 class="nm-l ed" data-n="Name" data-t="1">Noura Al-Otaibi</h1>
    <p class="rl ed" data-n="What you do" data-t="1">Brand identity designer</p>
    <p class="bo ed" data-n="About" data-t="1">I build identities for new ventures in Riyadh — cafés, retail and cultural projects. I work with founders from the first conversation through to the last piece of signage.</p>
    <div class="meta">
      <div><b class="ed" data-n="Projects" data-t="1">38</b><span>Projects</span></div>
      <div><b class="ed" data-n="Years" data-t="1">6</b><span>Years</span></div>
      <div><b class="ed" data-n="Clients" data-t="1">24</b><span>Clients</span></div>
    </div>
  </section>

  <section class="work">
    <div class="wh">
      <h2 class="ed" data-n="Section" data-t="1">Selected work</h2>
      <span class="hint" id="hint">Drag to reorder</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="contact"><button class="ed" data-n="Button" data-t="1">Work with me</button></div>
</main>

<div class="ctl" id="ctl"></div>

<script>
/* ------------------------------------------------------------------ state */
const $=s=>document.querySelector(s);
let lang='en', site='#1E4FA3', paper='#ffffff', sink='#101828', sel=null;

/* A finished portfolio. Six real projects — the screen has to be judged with
   the weight of actual work on it, not with two placeholders. */
let projects=[
  {id:1,t:'Nuwa Coffee',s:'Identity, menu, signage',m:0},
  {id:2,t:'Misk Botanicals',s:'Packaging system',m:1},
  {id:3,t:'Hilya',s:'Jewellery brand, art direction',m:2},
  {id:4,t:'Dar Al Fann',s:'Cultural centre identity',m:3},
  {id:5,t:'Rawi Books',s:'Bookshop brand, wayfinding',m:4},
  {id:6,t:'Sard Studio',s:'Visual identity',m:5},
];
let seq=7;

/* Flat cover marks. No gradients anywhere. */
const MARKS=[
  s=>`<i style="background:${s}"></i>`,
  s=>`<i style="background:${s}"><svg viewBox="0 0 100 75" width="100%" height="100%"><circle cx="50" cy="37" r="19" fill="rgba(255,255,255,.30)"/></svg></i>`,
  s=>`<i style="background:${s}"><svg viewBox="0 0 100 75" width="100%" height="100%"><rect x="18" y="14" width="64" height="47" fill="none" stroke="rgba(255,255,255,.40)" stroke-width="3"/></svg></i>`,
  s=>`<i style="background:${s}"><svg viewBox="0 0 100 75" width="100%" height="100%"><path d="M0 60 L34 24 L58 46 L100 10" fill="none" stroke="rgba(255,255,255,.36)" stroke-width="5"/></svg></i>`,
  s=>`<i style="background:${s}"><svg viewBox="0 0 100 75" width="100%" height="100%"><rect x="0" y="0" width="50" height="75" fill="rgba(255,255,255,.18)"/></svg></i>`,
  s=>`<i style="background:${s}"><svg viewBox="0 0 100 75" width="100%" height="100%"><circle cx="30" cy="37" r="14" fill="rgba(255,255,255,.26)"/><circle cx="66" cy="37" r="14" fill="rgba(255,255,255,.26)"/></svg></i>`,
];

const T={
  en:{bar:'Studio',app:'Appearance',lang:'العربية',accent:'Accent',paper:'Paper',
      hint:'Drag to reorder',cover:'Cover',dup:'Duplicate',del:'Remove',untitled:'Untitled'},
  ar:{bar:'الاستوديو',app:'المظهر',lang:'English',accent:'اللون',paper:'الخلفية',
      hint:'اسحب لإعادة الترتيب',cover:'الغلاف',dup:'نسخ',del:'حذف',untitled:'بلا عنوان'},
};
const t=()=>T[lang];

/* ------------------------------------------------------------------ render */
function render(){
  const g=$('#grid'); g.innerHTML='';
  projects.forEach(p=>{
    const el=document.createElement('article');
    el.className='card'; el.dataset.id=p.id;
    el.innerHTML=
      `<button class="grip" aria-label="Reorder">⠿</button>
       <div class="cov">${MARKS[p.m%MARKS.length](site)}</div>
       <h3 class="ed" data-n="Title" data-t="1">${p.t}</h3>
       <p class="ed" data-n="Line" data-t="1">${p.s}</p>`;
    el.querySelector('.cov').addEventListener('click',e=>{e.stopPropagation();select(p.id,el)});
    wireDrag(el);
    g.appendChild(el);
  });
}

/* --------------------------------------------------------- text, in place */
document.addEventListener('click',e=>{
  const ed=e.target.closest('.ed');
  if(!ed){ deselect(); closeTray(); return; }
  if(ed.isContentEditable) return;
  deselect();
  ed.contentEditable='true'; ed.focus();
  const r=document.createRange(); r.selectNodeContents(ed);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  const stop=()=>{
    ed.contentEditable='false';
    /* keep the model honest when a card title is edited on the canvas */
    const card=ed.closest('.card');
    if(card){
      const p=projects.find(x=>x.id==card.dataset.id);
      if(p){ if(ed.tagName==='H3') p.t=ed.textContent.trim(); else p.s=ed.textContent.trim(); }
    }
    ed.removeEventListener('blur',stop);
  };
  ed.addEventListener('blur',stop);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ document.activeElement.blur?.(); deselect(); closeTray(); }
  if(e.key==='Enter'&&document.activeElement.isContentEditable&&document.activeElement.tagName!=='P'){
    e.preventDefault(); document.activeElement.blur();
  }
});

/* ------------------------------------------------------ project selection.
   The controls open AT the project, anchored to it. */
function select(id,el){
  deselect(); sel=id; el.classList.add('sel');
  const p=projects.find(x=>x.id===id);
  const c=$('#ctl');
  c.innerHTML=`
    <div><div class="lb">${t().cover}</div><div class="sw-row" id="covs"></div></div>
    <div class="ctl-act">
      <button class="mini" id="dup">${t().dup}</button>
      <button class="mini" id="del">${t().del}</button>
    </div>`;
  const row=c.querySelector('#covs');
  MARKS.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='sw'+(i===p.m?' on':''); b.style.background=site;
    b.style.opacity=(0.45+i*0.11).toFixed(2);
    b.onclick=()=>{
      p.m=i; row.querySelectorAll('.sw').forEach(n=>n.classList.remove('on')); b.classList.add('on');
      /* cross-fade the cover in place; a blink would read as a reload */
      const cov=el.querySelector('.cov'), old=cov.querySelector('i');
      cov.insertAdjacentHTML('beforeend',MARKS[i](site));
      const next=cov.lastElementChild; next.classList.add('out');
      requestAnimationFrame(()=>{next.classList.remove('out'); old.classList.add('out');
        setTimeout(()=>old.remove(),300);});
    };
    row.appendChild(b);
  });
  c.querySelector('#dup').onclick=()=>{
    const i=projects.findIndex(x=>x.id===id);
    projects.splice(i+1,0,{...p,id:seq++});
    flip(render); deselect();
  };
  c.querySelector('#del').onclick=()=>{
    projects=projects.filter(x=>x.id!==id); flip(render); deselect();
  };
  place(c,el); c.classList.add('open');
}
function place(c,el){
  const r=el.getBoundingClientRect();
  const w=264, gap=10;
  let x=r.right+gap;
  if(x+w>innerWidth-12) x=r.left-w-gap;      /* flip side when it would clip */
  if(x<12) x=Math.max(12,r.left);
  c.style.left=x+'px';
  c.style.top=Math.min(r.top,innerHeight-260)+'px';
}
function deselect(){
  document.querySelectorAll('.card.sel').forEach(n=>n.classList.remove('sel'));
  $('#ctl').classList.remove('open'); sel=null;
}
$('#ctl').addEventListener('click',e=>e.stopPropagation());

/* --------------------------------------------------------------- reorder.
   FLIP: measure, mutate, invert, play. The cards travel to their new homes,
   which is what makes it read as "my page rearranged" and not "a list
   refreshed". */
function flip(mutate){
  const before=new Map();
  document.querySelectorAll('.card').forEach(c=>before.set(c.dataset.id,c.getBoundingClientRect()));
  mutate();
  document.querySelectorAll('.card').forEach(c=>{
    const b=before.get(c.dataset.id); if(!b) return;
    const a=c.getBoundingClientRect();
    const dx=b.left-a.left, dy=b.top-a.top;
    if(!dx&&!dy) return;
    c.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>{
      c.classList.add('flip'); c.style.transform='';
      setTimeout(()=>{c.classList.remove('flip')},320);
    });
  });
}
function move(from,to){
  if(to<0||to>=projects.length||from===to) return;
  flip(()=>{ const [p]=projects.splice(from,1); projects.splice(to,0,p); render(); });
}

let dragId=null;
function wireDrag(el){
  const grip=el.querySelector('.grip');
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault(); dragId=el.dataset.id; el.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointerenter',()=>{
    if(dragId&&dragId!==el.dataset.id) el.classList.add('drop-hint');
  });
  el.addEventListener('pointerleave',()=>el.classList.remove('drop-hint'));
  el.addEventListener('pointerup',()=>{
    if(!dragId||dragId===el.dataset.id) return;
    const from=projects.findIndex(p=>String(p.id)===dragId);
    const to=projects.findIndex(p=>String(p.id)===el.dataset.id);
    document.querySelectorAll('.drop-hint').forEach(n=>n.classList.remove('drop-hint'));
    move(from,to); dragId=null;
  });
}
document.addEventListener('pointerup',()=>{
  document.querySelectorAll('.dragging,.drop-hint').forEach(n=>n.classList.remove('dragging','drop-hint'));
  dragId=null;
});

/* ------------------------------------------------------------- appearance */
const ACCENTS=['#1E4FA3','#0E7C66','#B4531F','#6D3FA8','#B22B4E','#1E2A44'];
const PAPERS=[['#ffffff','#101828'],['#F6F4EF','#1A1614'],['#0F1115','#F2F4F8'],['#0E1714','#E9F2ED']];
function paintTray(){
  const a=$('#accents'); a.innerHTML='';
  ACCENTS.forEach(c=>{
    const b=document.createElement('button');
    b.className='sw'+(c===site?' on':''); b.style.background=c;
    b.onclick=()=>{ site=c; document.documentElement.style.setProperty('--site',c);
      paintTray(); render();          /* the whole page transforms in place */
      /* the cards were rebuilt and any open project panel now shows swatches
         in the previous colour — close it rather than leave it lying */
      deselect(); };
    a.appendChild(b);
  });
  const p=$('#papers'); p.innerHTML='';
  PAPERS.forEach(([bg,ink])=>{
    const b=document.createElement('button');
    b.className='sw'+(bg===paper?' on':''); b.style.background=bg;
    b.style.boxShadow='inset 0 0 0 1px rgba(128,128,128,.35)';
    b.onclick=()=>{ paper=bg; sink=ink;
      document.documentElement.style.setProperty('--paper',bg);
      document.documentElement.style.setProperty('--sink',ink);
      paintTray(); };
    p.appendChild(b);
  });
}
function closeTray(){ $('#tray').classList.remove('open'); $('#appBtn').classList.remove('on') }
$('#appBtn').addEventListener('click',e=>{
  e.stopPropagation();
  const open=$('#tray').classList.toggle('open');
  $('#appBtn').classList.toggle('on',open);
});
$('#tray').addEventListener('click',e=>e.stopPropagation());

/* photo: a click replaces it; here it simply cycles opacity to show response */
$('#photo').addEventListener('click',e=>e.stopPropagation());

/* ---------------------------------------------------------------- language */
$('#langBtn').addEventListener('click',e=>{
  e.stopPropagation();
  lang=lang==='en'?'ar':'en';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#langBtn').textContent=t().lang;
  $('#barTxt').textContent=t().bar; $('#appTxt').textContent=t().app;
  $('#lbAccent').textContent=t().accent; $('#lbPaper').textContent=t().paper;
  $('#hint').textContent=t().hint;
  deselect();
});

addEventListener('resize',()=>{ if(sel){ const el=document.querySelector('.card.sel'); if(el) place($('#ctl'),el);} });
addEventListener('scroll',()=>{ if(sel){ const el=document.querySelector('.card.sel'); if(el) place($('#ctl'),el);} },{passive:true});

render(); paintTray();
</script>

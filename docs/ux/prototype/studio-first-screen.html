<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — the first screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   THE FIRST SCREEN — what a creator sees the moment they enter Studio.

   No navigation. No settings. No forms. No publishing. One page.

   The idea it is built on: a new portfolio is not empty, it is UNWRITTEN.
   So this screen never shows a blank slate or a setup checklist. It shows the
   creator's own page, at full size, already carrying their name — with the
   remaining lines present as real typography waiting to be replaced.

   Three things carry the feeling:

   1. THE PAGE COMPOSES ITSELF on arrival. Nothing pops. Lines rise in sequence
      with the existing --t-stag step, so the portfolio assembles in front of
      you rather than being served to you.
   2. ONE THING IS ASKED AT A TIME. The next line does not exist until the
      current one is answered. Restraint here is not visual — it is how much
      the screen is willing to want from you at once.
   3. WRITING IS THE INTERACTION. There is no field to fill and no button to
      save. You click the sentence and it is yours.

   Tokens are the product's own (styles/globals.css). Motion uses only the
   existing --t-* and --ease-* values. No dependency: CSS transitions and
   keyframes only.
   ========================================================================= */

:root{
  --bg:#ffffff;
  --ink:#0c1530;
  --ink-2:rgba(12,21,48,.72);
  --ink-3:rgba(12,21,48,.38);
  --ink-4:rgba(12,21,48,.16);
  --brand:#2A6BCE;
  --brand-soft:rgba(42,107,206,.10);
  --brand-line:rgba(42,107,206,.30);
  --brand-focus:rgba(42,107,206,.55);

  --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-8:48px; --space-10:64px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;

  --t-press:.11s; --t-ui:.22s; --t-enter:.30s; --t-stag:.06s;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-pop:cubic-bezier(.2,1.06,.32,1);

  --font:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-ar:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;

  --lead:clamp(38px,6vw,68px);
  --role:clamp(20px,2.4vw,28px);
  --body:clamp(16px,1.5vw,19px);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
:focus-visible{outline:2px solid var(--brand-focus);outline-offset:4px;border-radius:4px}

/* The page has one column and a lot of margin. The restraint that reads as
   expensive is mostly this: the content is narrower than the room it is in. */
.page{
  min-height:100%;
  padding:clamp(40px,7vh,88px) clamp(24px,8vw,120px) 160px;
  max-inline-size:1180px;margin-inline:auto;
}

/* The only piece of chrome on the screen. It is a mark, not a toolbar. */
.mark{
  display:flex;align-items:center;gap:10px;
  margin-block-end:clamp(56px,10vh,110px);
  opacity:0;animation:rise var(--t-enter) var(--ease) .05s forwards;
}
.mark i{
  inline-size:26px;block-size:26px;border-radius:7px;
  background:var(--brand);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:800;font-style:normal;
}
.mark span{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}

/* Whisper-quiet, because Arabic is not an afterthought — but it is also not
   the point of this screen. */
.lang{
  margin-inline-start:auto;background:none;border:0;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-3);
  padding:6px 8px;border-radius:var(--radius-sm);
  transition:color var(--t-ui) var(--ease),background-color var(--t-ui) var(--ease);
}
.lang:hover{color:var(--ink);background:var(--brand-soft)}

/* ------------------------------------------------------------ composition.
   Each line rises once, in order. The stagger is the product's own --t-stag,
   multiplied — this is the page assembling, and it happens exactly once. */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.step{opacity:0}
.step.in{animation:rise var(--t-enter) var(--ease) both}

.greet{
  font-size:13px;font-weight:700;color:var(--ink-3);
  letter-spacing:.12em;text-transform:uppercase;
  margin-block-end:var(--space-4);
}

/* --------------------------------------------------------------- the lines.
   A line is content, never a field. It has no box, no label and no border at
   rest. It is set at its final size and weight from the first frame, so the
   page always looks like a page — the only difference between "unwritten" and
   "written" is ink strength. */
.line{
  /* inline-block, not block: every affordance on this screen — the hover
     wash, and the underline that asks — must hug the words. Stretched to the
     column they read as form-field rules, which is the thing this screen is
     built to not be. */
  display:block;inline-size:fit-content;max-inline-size:100%;position:relative;
  border:0;padding:0;margin:0;
  font-family:inherit;color:var(--ink);
  cursor:text;border-radius:6px;
  transition:color var(--t-ui) var(--ease),box-shadow var(--t-ui) var(--ease);
}
.line:hover{box-shadow:0 0 0 6px var(--brand-soft)}
.line[contenteditable="true"]{outline:none;box-shadow:0 0 0 6px var(--brand-soft)}
.line.unwritten{color:var(--ink-3)}

.name{font-size:var(--lead);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.role{font-size:var(--role);font-weight:600;color:var(--brand);margin-block-start:var(--space-4)}
.role.unwritten{color:var(--ink-3)}
.about{
  font-size:var(--body);line-height:1.6;color:var(--ink-2);
  max-inline-size:58ch;margin-block-start:var(--space-6);
}
.about.unwritten{color:var(--ink-3)}

/* The invitation to write: a hairline that draws itself under the line the
   screen is currently asking about. It is the only animated thing on the page
   at rest, so attention has exactly one place to go. */
.line.asking::after{
  content:"";position:absolute;
  inset-block-end:-6px;inset-inline-start:0;
  block-size:2px;inline-size:100%;
  background:var(--brand);transform-origin:inline-start;
  animation:draw .5s var(--ease) both, pulse 3.2s var(--ease) .6s infinite;
}
[dir="rtl"] .line.asking::after{transform-origin:right}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.line.asking[contenteditable="true"]::after{animation:draw .5s var(--ease) both}

/* ------------------------------------------------------------- first work.
   Not a card grid and not an upload dropzone. One wide, calm invitation that
   occupies the space a real project will occupy, so adding one changes the
   page rather than replacing a placeholder. */
.work{margin-block-start:clamp(56px,9vh,96px)}
.work h2{
  font-size:13px;font-weight:700;color:var(--ink-3);
  letter-spacing:.12em;text-transform:uppercase;
  margin:0 0 var(--space-5);
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-5)}

.invite{
  grid-column:1/-1;
  display:flex;align-items:center;gap:var(--space-5);
  padding:var(--space-8);
  background:none;border:1px dashed var(--ink-4);border-radius:var(--radius-lg);
  cursor:pointer;text-align:start;font-family:inherit;
  transition:border-color var(--t-ui) var(--ease),background-color var(--t-ui) var(--ease),
             transform var(--t-press) var(--ease);
}
.invite:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.invite:active{transform:scale(.995)}
.invite .plus{
  inline-size:44px;block-size:44px;flex-shrink:0;
  border-radius:50%;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-size:20px;font-weight:600;line-height:1;
  transition:transform var(--t-enter) var(--ease-pop);
}
.invite:hover .plus{transform:scale(1.07)}
.invite b{display:block;font-size:var(--body);font-weight:700}
.invite span{display:block;font-size:14px;color:var(--ink-3);margin-block-start:4px}
/* Once one project exists the invitation stops being the hero and becomes a
   quiet tile beside the work. The screen stops asking as loudly. */
.invite.secondary{
  grid-column:auto;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:var(--space-3);padding:var(--space-5);aspect-ratio:4/3;
}
.invite.secondary .plus{inline-size:34px;block-size:34px;font-size:17px}

@keyframes place{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.proj{display:grid;gap:var(--space-3);animation:place var(--t-enter) var(--ease-pop) both}
.cover{
  aspect-ratio:4/3;border-radius:var(--radius-md);
  /* Flat. The system forbids gradients, and an empty cover is a place for the
     creator's image, not for our decoration. */
  background:var(--brand-soft);
  box-shadow:inset 0 0 0 1px var(--ink-4);
}
.proj .t{font-size:15px;font-weight:700}

/* Arabic is a different setting, not a mirrored one: display face changes,
   tracking is removed, lines open up. Direction comes from logical properties. */
[dir="rtl"] .name{font-family:var(--font-ar);letter-spacing:0;line-height:1.3}
[dir="rtl"] .about{line-height:1.85}
[dir="rtl"] .greet,[dir="rtl"] .work h2{letter-spacing:0;text-transform:none}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="page">

  <div class="mark">
    <i>د</i><span id="markTxt">Studio</span>
    <button class="lang" id="lang">العربية</button>
  </div>

  <div class="greet step" id="greet" data-i="1">Welcome, Noura</div>

  <!-- The name is already written, because we already know it. The screen
       never asks for something it has. -->
  <h1 class="line name step" id="name" data-i="2">Noura Al-Otaibi</h1>

  <p class="line role step unwritten" id="role" data-i="3">Say what you do</p>

  <p class="line about step unwritten" id="about" data-i="4">Write a few lines about your work — who you make things for, and what you care about.</p>

  <section class="work step" id="work" data-i="5">
    <h2 id="workTitle">Your work</h2>
    <div class="grid" id="grid">
      <button class="invite" id="invite">
        <span class="plus">＋</span>
        <span>
          <b id="inviteT">Add your first project</b>
          <span id="inviteS">A cover image, a title, a line about it. That is all it takes.</span>
        </span>
      </button>
    </div>
  </section>

</div>

<script>
/* ---------------------------------------------------------------------------
   The sequence. Only as much of the page exists as the creator has reached.
   ------------------------------------------------------------------------ */
const $=s=>document.querySelector(s);
const steps=[...document.querySelectorAll('.step')];
const order=['role','about','work'];      /* what the screen asks for, in turn */
let at=0, lang='en', projects=0;

const T={
  en:{mark:'Studio',greet:'Welcome, Noura',lang:'العربية',
      role:'Say what you do',
      about:'Write a few lines about your work — who you make things for, and what you care about.',
      work:'Your work',inviteT:'Add your first project',
      inviteS:'A cover image, a title, a line about it. That is all it takes.',
      more:'Add another',moreS:'Your work reads best in threes.',untitled:'Untitled project'},
  ar:{mark:'الاستوديو',greet:'أهلًا نورة',lang:'English',
      role:'اكتبي ما الذي تعملينه',
      about:'اكتبي سطورًا عن عملك — لمن تصممين، وما الذي يهمك في ما تصنعينه.',
      work:'أعمالك',inviteT:'أضيفي أول مشروع',
      inviteS:'صورة، وعنوان، وسطر واحد. هذا كل ما يلزم.',
      more:'أضيفي مشروعًا آخر',moreS:'أعمالك تبدو أفضل حين تكون ثلاثة.',untitled:'مشروع بلا عنوان'},
};
const t=()=>T[lang];

/* --- arrival: the page composes itself, once ---------------------------- */
/* Only the first three steps arrive on load. The rest is earned. */
steps.forEach(el=>{
  const i=+el.dataset.i;
  if(i<=3){ el.style.animationDelay=(0.10+i*0.06)+'s'; el.classList.add('in'); }
});
setTimeout(()=>ask(0),900);   /* the underline appears after the page settles */

/* --- asking ------------------------------------------------------------- */
function ask(n){
  at=n;
  document.querySelectorAll('.asking').forEach(e=>e.classList.remove('asking'));
  const id=order[n];
  if(!id) return;
  if(id==='work'){ reveal($('#work')); return; }
  const el=$('#'+id);
  reveal(el);
  el.classList.add('asking');
}
function reveal(el){
  if(el.classList.contains('in')) return;
  el.style.animationDelay='0s';
  el.classList.add('in');
}

/* --- writing ------------------------------------------------------------
   Click the sentence, it is yours. No field appears, nothing is saved, and
   the placeholder leaves the moment the first character lands. */
['role','about'].forEach(id=>{
  const el=$('#'+id);
  el.addEventListener('click',()=>{
    if(el.isContentEditable) return;
    if(el.classList.contains('unwritten')){ el.textContent=''; el.classList.remove('unwritten'); }
    el.contentEditable='true'; el.focus();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&id==='role'){ e.preventDefault(); el.blur(); }
    if(e.key==='Escape') el.blur();
  });
  el.addEventListener('blur',()=>{
    el.contentEditable='false';
    const written=el.textContent.trim().length>0;
    if(!written){                     /* nothing lost: the prompt comes back */
      el.textContent=t()[id]; el.classList.add('unwritten'); return;
    }
    el.classList.remove('asking');
    /* A beat before the next line arrives. Immediately would feel like a form
       advancing; the pause reads as the page responding. */
    if(order[at]===id) setTimeout(()=>ask(at+1),340);
  });
});

/* --- first project ------------------------------------------------------ */
$('#invite').addEventListener('click',()=>{
  const g=$('#grid'), inv=$('#invite');
  const el=document.createElement('article');
  el.className='proj';
  el.innerHTML='<div class="cover"></div><div class="t" contenteditable="true"></div>';
  el.querySelector('.t').textContent=t().untitled;
  g.insertBefore(el,inv);
  projects++;
  if(projects===1){                   /* the ask quietens once it is answered */
    inv.classList.add('secondary');
    $('#inviteT').textContent=t().more;
    $('#inviteS').textContent=t().moreS;
  }
  const title=el.querySelector('.t');
  setTimeout(()=>{
    title.focus();
    const r=document.createRange(); r.selectNodeContents(title);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  },260);
});

/* --- language ----------------------------------------------------------- */
$('#lang').addEventListener('click',()=>{
  lang=lang==='en'?'ar':'en';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#lang').textContent=t().lang;
  $('#markTxt').textContent=t().mark;
  $('#greet').textContent=t().greet;
  $('#workTitle').textContent=t().work;
  $('#inviteT').textContent=projects?t().more:t().inviteT;
  $('#inviteS').textContent=projects?t().moreS:t().inviteS;
  ['role','about'].forEach(id=>{
    const el=$('#'+id);
    if(el.classList.contains('unwritten')) el.textContent=t()[id];
  });
});
</script>
</body>
</html>
